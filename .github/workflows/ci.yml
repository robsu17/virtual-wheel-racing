name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Testes, APK e instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew.bat test :android:engine:testDebugUnitTest --console=plain

      - name: APK de depuração
        run: ./gradlew.bat :android:app:assembleDebug --console=plain

      - name: Instalador do Windows
        run: ./gradlew.bat :desktop:app:packageMsi --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: virtual-wheel-racing
          path: |
            android/app/build/outputs/apk/debug/*.apk
            desktop/app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
